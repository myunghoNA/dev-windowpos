name: Build Windows POS App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "빌드 환경"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stag
          - prod
      deploy:
        description: "OCI 버킷에 업로드할까요?"
        required: true
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.1"
          architecture: x86
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile (${{ github.event.inputs.environment }})
        run: npm run compile:${{ github.event.inputs.environment }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: windows-pos-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: |
            dist/app/${{ github.event.inputs.environment }}/**/*.exe
            dist/app/${{ github.event.inputs.environment }}/**/*.yml
            dist/app/${{ github.event.inputs.environment }}/**/*.blockmap
          retention-days: 14

      - name: Upload to OCI Object Storage (verify before going live)
        if: ${{ github.event.inputs.deploy == 'true' }}
        shell: pwsh
        run: |
          $parUrl = "${{ secrets.OCI_UPLOAD_PAR_URL }}"
          $readParUrl = "여기에_실제_읽기전용_PAR_URL_붙여넣기"
          $dir = "dist/app/stag"

          if ($readParUrl -notmatch '^https://') {
            Write-Error "readParUrl이 실제 URL로 설정되지 않았습니다: $readParUrl"
            exit 1
          }

          function Get-Base64Sha512($path) {
              $bytes = [System.Security.Cryptography.SHA512]::Create().ComputeHash([System.IO.File]::ReadAllBytes($path))
              return [Convert]::ToBase64String($bytes)
          }

          $payloadFiles = Get-ChildItem -Path "$dir\*" -File | Where-Object {
              ($_.Extension -eq '.exe' -and $_.Name -ne 'elevate.exe') -or $_.Extension -eq '.blockmap'
          }
          $latestYml = Get-ChildItem -Path "$dir\*" -File -Filter 'latest.yml'
          $failed = $false

          if (-not $payloadFiles -or -not $latestYml) {
            Write-Error "업로드할 대상 파일을 찾지 못했습니다 (payload: $($payloadFiles.Count)개, latest.yml: $($latestYml.Count)개)"
            exit 1
          }

          # 1단계: 인스톨러 + blockmap 먼저 업로드하고 즉시 재검증
          foreach ($file in $payloadFiles) {
            $encodedName = [System.Uri]::EscapeDataString($file.Name)
            Write-Host "Uploading $($file.Name)"
            curl.exe -f -X PUT --data-binary "@$($file.FullName)" "$parUrl$encodedName"
            if ($LASTEXITCODE -ne 0) { $failed = $true; continue }

            $localHash = Get-Base64Sha512 $file.FullName
            $tmpFile = Join-Path $env:TEMP "verify-$($file.Name)"
            curl.exe -f -o $tmpFile "$readParUrl$encodedName"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $tmpFile)) {
              Write-Error "$($file.Name) 재다운로드 실패"
              $failed = $true
              continue
            }
            $remoteHash = Get-Base64Sha512 $tmpFile
            if ($remoteHash -ne $localHash) {
              Write-Error "$($file.Name) 해시 불일치 - 업로드 손상 의심"
              $failed = $true
            } else {
              Write-Host "$($file.Name) 검증 완료"
            }
          }

          if ($failed) {
            Write-Error "검증 실패 - latest.yml은 올리지 않습니다 (기존 버전이 계속 live로 유지됩니다)"
            exit 1
          }

          # 2단계: 전부 통과했을 때만 latest.yml 업로드
          $encodedYml = [System.Uri]::EscapeDataString($latestYml.Name)
          curl.exe -f -X PUT --data-binary "@$($latestYml.FullName)" "$parUrl$encodedYml"
          if ($LASTEXITCODE -ne 0) { Write-Error "latest.yml 업로드 실패"; exit 1 }

          Write-Host "배포 완료 - latest.yml 갱신됨, 새 버전이 사용자에게 노출됩니다"
