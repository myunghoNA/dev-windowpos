name: Build Windows POS App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "빌드 환경"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stag
          - prod
      deploy:
        description: "OCI 버킷에 업로드할까요?"
        required: true
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.1"
          architecture: x86
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile (${{ github.event.inputs.environment }})
        run: npm run compile:${{ github.event.inputs.environment }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: windows-pos-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: |
            dist/app/${{ github.event.inputs.environment }}/**/*.exe
            dist/app/${{ github.event.inputs.environment }}/**/*.yml
            dist/app/${{ github.event.inputs.environment }}/**/*.blockmap
          retention-days: 14

      - name: Upload to OCI Object Storage
        if: ${{ github.event.inputs.deploy == 'true' }}
        shell: pwsh
        run: |
          $parUrl = "${{ secrets.OCI_UPLOAD_PAR_URL }}"
          $files = Get-ChildItem -Path "dist/app/stag\*" -File -Include *.exe,*.yml,*.blockmap
          $failed = $false

          foreach ($file in $files) {
            $encodedName = [System.Uri]::EscapeDataString($file.Name)
            $uploadUrl = "$parUrl$encodedName"
            Write-Host "Uploading $($file.Name)"
            curl.exe -f -X PUT --data-binary "@$($file.FullName)" "$uploadUrl"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to upload $($file.Name)"
              $failed = $true
            }
          }

          if ($files.Count -eq 0) {
            Write-Error "업로드할 파일을 찾지 못했습니다 - 경로를 확인하세요"
            exit 1
          }
          if ($failed) { exit 1 }
