name: Build Windows POS App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "빌드 환경"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stag
          - prod

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile (${{ github.event.inputs.environment }})
        run: npm run compile:${{ github.event.inputs.environment }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-pos-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: dist/app/${{ github.event.inputs.environment }}/**/*.exe
          retention-days: 14
